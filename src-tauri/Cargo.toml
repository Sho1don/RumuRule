[package]
name = "rumurule"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks", "blocking"] }
url = "2"
libc = "0.2"
# Same GLib the GTK stack already links; used to filter one library notice.
glib = "0.18"
rumurule-core = { path = "../crates/core" }
